- date: "Aug 2028"
  text: "Our project, [**VINES Track 2: SCOPE-XR — Seeing the Channel: Optimizing Perception-aware Environments for XR**](https://www.nsf.gov/awardsearch/show-award?AWD_ID=2554332), has been awarded by the **National Science Foundation (NSF)**! UGA leads the $5.1M effort in collaboration with UT Austin, Virginia Tech, UW–Madison, and Ericsson Inc."

- date: "Aug 2026"
  text: "Our paper [**AutoNetSim**](https://pervasive-intelligence-lab.github.io/agentic-sionna/) was accepted to **IEEE ICNP 2026**. This marks a special milestone: Runnan, my first student, has his first paper accepted. Congratulations to Runnan and John!"

- date: "Aug 2026"
  text: "Our paper **RadioSight** was accepted to **ACM MobiCom 2026**. It proposes dynamic neural ray tracing for millimeter-wave XR network prediction and optimization. [Project page](https://pervasive-intelligence-lab.github.io/radiosight/)"

- date: "May 2026"
  text: "Invited to serve on the TPC for **IEEE INFOCOM 2027** and **IEEE MASS 2026**."

- date: "Apr 2026"
  text: "Gave an invited talk on high-fidelity radio digital twins at **Accenture**."

- date: "Mar 2026"
  text: "Gave an invited talk on high-fidelity radio digital twins at the **NextG Channel Model Alliance**."

- date: "May 2025"
  text: "Invited to serve on the TPC for BodySys 2025, and our SenSys 2025 paper **LeakyFeeder** has been nominated for a Best Paper Award."

- date: "Dec 2023"
  text: "One paper on cross-medium communication and one on optical metasurfaces accepted to **MobiCom 2024**; one paper on RFID systems accepted to **NSDI 2024**."

- date: "Oct 2023"
