<svg viewBox="0 0 900 345" xmlns="http://www.w3.org/2000/svg" fill="#1c2025" role="img" aria-labelledby="ai-title">
  <title id="ai-title">AI-native wireless loop: LLM agents turn a natural-language intent into a radio twin and simulation, observe the results, and store verified skills; the radio twin supplies synthetic data to AI-native networks and sensing systems, which return real measurements to calibrate the twin.</title>
  <defs>
    <marker id="ai-ah-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0642b"/></marker>
    <marker id="ai-ah-n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4f8f"/></marker>
    <marker id="ai-ah-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d5b"/></marker>
    <radialGradient id="ai-heat" gradientUnits="userSpaceOnUse" cx="365" cy="240" r="210">
      <stop offset="0" stop-color="#f6c56b"/>
      <stop offset="0.3" stop-color="#f4e2b0"/>
      <stop offset="0.6" stop-color="#d5e4f3"/>
      <stop offset="1" stop-color="#a9c3e4"/>
    </radialGradient>
  </defs>

  <!-- ===== Panel A: agents ===== -->
  <rect x="10" y="10" width="240" height="325" rx="12" fill="#fdf4ee" stroke="#efd0bd"/>
  <text x="130" y="36" text-anchor="middle" class="rf-h" style="fill:#a8442c">Agentic layer</text>
  <rect x="24" y="50" width="212" height="52" rx="10" fill="#fff" stroke="#e2b89c"/>
  <path d="M64,101.5 L60,114 L80,101.5" fill="#fff" stroke="#e2b89c"/>
  <rect x="62" y="99" width="16" height="4" fill="#fff"/>
  <g font-size="12" font-style="italic" text-anchor="middle">
    <text x="130" y="72">“Simulate 28 GHz coverage in</text>
    <text x="130" y="89">my lab with two APs.”</text>
  </g>
  <line x1="130" y1="106" x2="130" y2="122" stroke="#c0642b" stroke-width="1.5" marker-end="url(#ai-ah-w)"/>
  <circle cx="130" cy="149" r="24" fill="#c0642b"/>
  <line x1="130" y1="140" x2="130" y2="134" stroke="#fff" stroke-width="2"/>
  <circle cx="130" cy="133" r="2.5" fill="#fff"/>
  <rect x="117" y="140" width="26" height="19" rx="5" fill="#fff"/>
  <circle cx="124.5" cy="149.5" r="2.6" fill="#c0642b"/>
  <circle cx="135.5" cy="149.5" r="2.6" fill="#c0642b"/>
  <text x="130" y="191" text-anchor="middle" class="rf-b">LLM agents</text>
  <text x="130" y="206" text-anchor="middle" class="rf-m">orchestrator + specialist workers</text>
  <g font-size="11" font-weight="600" text-anchor="middle" style="fill:#a8442c">
    <rect x="24" y="218" width="50" height="22" rx="11" fill="#fff" stroke="#e2b89c"/><text x="49" y="233">Plan</text>
    <rect x="78" y="218" width="50" height="22" rx="11" fill="#fff" stroke="#e2b89c"/><text x="103" y="233">Build</text>
    <rect x="132" y="218" width="50" height="22" rx="11" fill="#fff" stroke="#e2b89c"/><text x="157" y="233">Simulate</text>
    <rect x="186" y="218" width="50" height="22" rx="11" fill="#fff" stroke="#e2b89c"/><text x="211" y="233">Verify</text>
  </g>
  <line x1="200" y1="243" x2="200" y2="256" stroke="#c0642b" stroke-width="1.5" marker-end="url(#ai-ah-w)"/>
  <line x1="60" y1="257" x2="60" y2="244" stroke="#c0642b" stroke-width="1.5" marker-end="url(#ai-ah-w)"/>
  <text x="208" y="253" class="rf-m" style="fill:#a8442c">learn</text>
  <text x="18" y="253" class="rf-m" style="fill:#a8442c">reuse</text>
  <path d="M52,264 V308 A78,8 0 0 0 208,308 V264" fill="#fff" stroke="#e2b89c"/>
  <ellipse cx="130" cy="264" rx="78" ry="8" fill="#fbe3d3" stroke="#e2b89c"/>
  <text x="130" y="288" text-anchor="middle" font-size="12" font-weight="700">Self-evolving skill memory</text>
  <text x="130" y="304" text-anchor="middle" class="rf-m">skills · fixes · failure roots</text>

  <!-- A <-> B -->
  <line x1="253" y1="140" x2="296" y2="140" stroke="#c0642b" stroke-width="1.8" marker-end="url(#ai-ah-w)"/>
  <text x="275" y="132" text-anchor="middle" class="rf-m" style="fill:#a8442c;font-weight:600">act</text>
  <line x1="296" y1="168" x2="253" y2="168" stroke="#1d4f8f" stroke-width="1.8" marker-end="url(#ai-ah-n)"/>
  <text x="275" y="184" text-anchor="middle" class="rf-m" style="fill:#1d4f8f;font-weight:600">observe</text>

  <!-- ===== Panel B: radio twin ===== -->
  <g transform="translate(10,0)">
  <rect x="290" y="10" width="290" height="325" rx="12" fill="#eef4fb" stroke="#c9d8ec"/>
  <text x="435" y="36" text-anchor="middle" class="rf-h" style="fill:#1d4f8f">Radio twin</text>
  <text x="435" y="54" text-anchor="middle" class="rf-t">physics-grounded · learnable · interactive</text>
  <polygon points="313,232 435,190 435,95 313,137" fill="#fff" fill-opacity="0.9" stroke="#b8c4d4"/>
  <polygon points="435,190 555,232 555,137 435,95" fill="#fff" fill-opacity="0.75" stroke="#b8c4d4"/>
  <polygon points="313,232 435,190 555,232 435,276" fill="url(#ai-heat)" stroke="#b8c4d4"/>
  <!-- line of sight (blocked) -->
  <line x1="369" y1="206" x2="489" y2="238" stroke="#5b6470" stroke-width="1.3" stroke-dasharray="4 3"/>
  <!-- reflected rays -->
  <polyline points="365,204 505,165 495,232" fill="none" stroke="#e8902a" stroke-width="2.2" stroke-linejoin="round"/>
  <polyline points="365,204 395,150 492,232" fill="none" stroke="#e8902a" stroke-width="1.6" stroke-opacity="0.75" stroke-linejoin="round"/>
  <circle cx="505" cy="165" r="3.2" fill="#e8902a"/>
  <circle cx="395" cy="150" r="3.2" fill="#e8902a"/>
  <!-- blocker -->
  <circle cx="430" cy="199" r="6" fill="#5b6470"/>
  <line x1="430" y1="208" x2="430" y2="232" stroke="#5b6470" stroke-width="7" stroke-linecap="round"/>
  <!-- Tx -->
  <line x1="365" y1="240" x2="365" y2="207" stroke="#1d4f8f" stroke-width="2.5"/>
  <circle cx="365" cy="204" r="4.5" fill="#1d4f8f"/>
  <path d="M357,195 a11,11 0 0 1 16,0 M352,190 a18,18 0 0 1 26,0" fill="none" stroke="#1d4f8f" stroke-width="1.5"/>
  <text x="349" y="257" font-size="11" font-weight="700" style="fill:#1d4f8f">Tx</text>
  <!-- Rx -->
  <rect x="489" y="232" width="11" height="18" rx="2" fill="#1c2025"/>
  <text x="505" y="250" font-size="11" font-weight="700">Rx</text>
  <text x="435" y="302" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#1d4f8f">Neural RF ray tracing</text>
  <text x="435" y="320" text-anchor="middle" class="rf-t">NeRF2 · RadioTwin · RIS-NeRF2 · RadioSight</text>
  </g>

  <!-- B <-> C -->
  <line x1="593" y1="150" x2="636" y2="150" stroke="#1d4f8f" stroke-width="1.8" marker-end="url(#ai-ah-n)"/>
  <text x="615" y="128" text-anchor="middle" class="rf-m" style="fill:#1d4f8f;font-weight:600">synthetic</text>
  <text x="615" y="141" text-anchor="middle" class="rf-m" style="fill:#1d4f8f;font-weight:600">data</text>
  <line x1="636" y1="288" x2="593" y2="288" stroke="#2f7d5b" stroke-width="1.8" marker-end="url(#ai-ah-g)"/>
  <text x="615" y="304" text-anchor="middle" class="rf-m" style="fill:#2f7d5b;font-weight:600">real</text>
  <text x="615" y="317" text-anchor="middle" class="rf-m" style="fill:#2f7d5b;font-weight:600">data</text>

  <!-- ===== Panel C: AI-native systems ===== -->
  <g transform="translate(20,0)">
  <rect x="620" y="10" width="250" height="325" rx="12" fill="#eef7f1" stroke="#c3e0cf"/>
  <text x="745" y="36" text-anchor="middle" class="rf-h" style="fill:#2f7d5b">AI-native systems</text>
  <text x="745" y="54" text-anchor="middle" class="rf-t">trained on synthetic + real data</text>
  <rect x="634" y="68" width="222" height="92" rx="8" fill="#fff" stroke="#c3e0cf"/>
  <text x="648" y="90" class="rf-b">Networks</text>
  <text x="648" y="110" class="rf-t">• predictive mmWave beams for XR</text>
  <text x="648" y="128" class="rf-t">• RIS &amp; antenna configuration</text>
  <text x="648" y="146" class="rf-t">• intent-driven experimentation</text>
  <rect x="634" y="170" width="222" height="74" rx="8" fill="#fff" stroke="#c3e0cf"/>
  <text x="648" y="192" class="rf-b">Sensing</text>
  <text x="648" y="212" class="rf-t">• indoor localization</text>
  <text x="648" y="230" class="rf-t">• tracking &amp; perception</text>
  <rect x="634" y="254" width="222" height="68" rx="8" fill="#fff" stroke="#2f7d5b" stroke-dasharray="5 3"/>
  <path d="M652,308 L662,274 L672,308 M656,296 H668" fill="none" stroke="#2f7d5b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M655,270 a9,9 0 0 1 14,0 M651,265 a15,15 0 0 1 22,0" fill="none" stroke="#2f7d5b" stroke-width="1.5"/>
  <text x="686" y="283" class="rf-b">Real deployments</text>
  <text x="686" y="301" class="rf-m">commodity radios, 28 GHz</text>
  <text x="686" y="315" class="rf-m">phased arrays &amp; testbeds</text>
  </g>
</svg>
